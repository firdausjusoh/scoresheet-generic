<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assessment Manager & Rubric Hub</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Poppins', sans-serif; }</style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 p-6 flex flex-col justify-between">
    <div class="max-w-5xl mx-auto w-full">
        <!-- Header -->
        <header class="bg-gradient-to-r from-blue-700 to-indigo-800 text-white rounded-2xl p-6 shadow-xl mb-6 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div>
                <span class="bg-blue-500/30 text-blue-200 text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider">Assessment Management Hub</span>
                <h1 class="text-2xl font-black mt-1">Course Scoresheets & Rubrics</h1>
                <p class="text-blue-100 text-xs mt-1">Configure customized criteria and band descriptors across courses</p>
            </div>
            <button onclick="showCreateModal()" class="bg-amber-400 hover:bg-amber-300 text-slate-900 px-4 py-2.5 rounded-xl text-xs font-bold shadow-md cursor-pointer transition-colors flex items-center gap-2">
                <i class="fa-solid fa-plus"></i> Create New Scheme
            </button>
        </header>

        <!-- Existing Schemes List -->
        <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200/80 mb-6">
            <h2 class="text-sm font-bold text-slate-700 uppercase tracking-wider mb-4 flex items-center gap-2">
                <i class="fa-solid fa-folder-open text-indigo-600"></i> Saved Course Schemes
            </h2>
            <div id="scoresheetsList" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
            <div id="emptyNotice" class="hidden text-center py-12 text-slate-400">
                <i class="fa-solid fa-clipboard-list text-4xl mb-3 text-slate-300"></i>
                <p class="text-sm">No schemes saved yet. Choose a preset or create one below.</p>
            </div>
        </div>

        <!-- Scheme Editor / Builder Panel -->
        <div id="editorPanel" class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200/80 mb-6 hidden">
            <div class="flex justify-between items-center border-b border-slate-100 pb-4 mb-4">
                <h2 class="text-sm font-bold text-slate-700 uppercase tracking-wider flex items-center gap-2" id="editorTitle">
                    <i class="fa-solid fa-sliders text-indigo-600"></i> Scheme Editor
                </h2>
                <button onclick="hideEditor()" class="text-slate-400 hover:text-slate-600 text-xs px-2 py-1 cursor-pointer">
                    <i class="fa-solid fa-xmark text-base"></i>
                </button>
            </div>

            <!-- Quick Preset Buttons -->
            <div class="mb-5 bg-slate-50 border border-slate-200/70 p-3.5 rounded-xl">
                <span class="block text-[11px] font-bold uppercase tracking-wider text-slate-500 mb-2">
                    <i class="fa-solid fa-bolt text-amber-500 mr-1"></i> Quick Fill Course Presets:
                </span>
                <div class="flex flex-wrap gap-2">
                    <button type="button" onclick="applyCoursePreset('BI201', 'English Proficiency 3: Speaking Assessment', 40)" class="bg-white hover:bg-indigo-50 hover:text-indigo-600 text-slate-700 border border-slate-200 px-3 py-1.5 rounded-lg text-xs font-semibold cursor-pointer transition-colors shadow-xs">
                        EP3 (English Proficiency 3)
                    </button>
                    <button type="button" onclick="applyCoursePreset('MKT2013', 'Principles of Marketing: Pitch Defense', 30)" class="bg-white hover:bg-indigo-50 hover:text-indigo-600 text-slate-700 border border-slate-200 px-3 py-1.5 rounded-lg text-xs font-semibold cursor-pointer transition-colors shadow-xs">
                        Marketing Pitch Defense
                    </button>
                    <button type="button" onclick="applyCoursePreset('BI102', 'English for Academic Purposes: Oral Presentation', 30)" class="bg-white hover:bg-indigo-50 hover:text-indigo-600 text-slate-700 border border-slate-200 px-3 py-1.5 rounded-lg text-xs font-semibold cursor-pointer transition-colors shadow-xs">
                        EAP Oral Presentation
                    </button>
                    <button type="button" onclick="applyCoursePreset('FYP401', 'Final Year Project: Viva Voce Defense', 50)" class="bg-white hover:bg-indigo-50 hover:text-indigo-600 text-slate-700 border border-slate-200 px-3 py-1.5 rounded-lg text-xs font-semibold cursor-pointer transition-colors shadow-xs">
                        FYP / Viva Voce
                    </button>
                </div>
            </div>

            <!-- Course Meta Inputs -->
            <div class="grid grid-cols-1 sm:grid-cols-4 gap-4 mb-6">
                <div>
                    <label class="block text-xs font-bold text-slate-500 mb-1">Course Code</label>
                    <input type="text" id="courseCode" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm font-mono font-bold uppercase focus:outline-indigo-500" placeholder="e.g. BI201">
                </div>
                <div class="sm:col-span-2">
                    <label class="block text-xs font-bold text-slate-500 mb-1">Course Full Name / Assessment Title</label>
                    <input type="text" id="courseFullName" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm font-semibold focus:outline-indigo-500" placeholder="e.g. English Proficiency 3: Speaking Assessment">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 mb-1">Total Weight (%)</label>
                    <input type="number" id="courseWeight" min="1" max="100" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm font-semibold focus:outline-indigo-500" placeholder="40">
                </div>
            </div>

            <!-- Tasks and Detailed Descriptor Builder -->
            <div class="mb-6">
                <div class="flex justify-between items-center mb-3">
                    <span class="text-xs font-bold uppercase text-slate-500">Tasks, Criteria & Scale Descriptors</span>
                    <button onclick="addTaskBlock()" class="bg-indigo-50 hover:bg-indigo-100 text-indigo-600 px-3 py-1 rounded-xl text-xs font-bold border border-indigo-200 cursor-pointer transition-colors">
                        <i class="fa-solid fa-plus mr-1"></i> Add Task
                    </button>
                </div>
                <div id="tasksContainer" class="space-y-6"></div>
            </div>

            <!-- Editor Action Buttons -->
            <div class="flex flex-col sm:flex-row justify-between items-center gap-4 pt-4 border-t border-slate-100">
                <button onclick="loadEP3FullPreset()" class="text-xs text-slate-500 hover:text-slate-800 font-semibold cursor-pointer">
                    <i class="fa-solid fa-rotate-left mr-1"></i> Reset to Full EP3 Rubric (with descriptors)
                </button>
                <div class="flex gap-2 w-full sm:w-auto">
                    <button onclick="hideEditor()" class="w-1/2 sm:w-auto bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold px-4 py-2.5 rounded-xl cursor-pointer">
                        Cancel
                    </button>
                    <button onclick="saveActiveProfile()" class="w-1/2 sm:w-auto bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold px-6 py-2.5 rounded-xl shadow-md cursor-pointer flex items-center justify-center gap-1.5">
                        <i class="fa-solid fa-floppy-disk"></i> Save & Launch Scoresheet
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const REGISTRY_KEY = 'UniSZA_Assessment_Registry_V1';
        const ACTIVE_ID_KEY = 'UniSZA_Active_Assessment_ID';

        // Full default EP3 scheme including original band descriptors
        const DEFAULT_EP3_SCHEMA = {
            courseCode: "BI201",
            courseFullName: "English Proficiency 3: Interactive Speaking Assessment",
            weight: 40,
            tasks: [
                {
                    id: "task_a",
                    name: "TASK A: Individual Speech",
                    criteria: [
                        {
                            id: "ta_tf",
                            name: "Task Fulfillment",
                            max: 5,
                            descriptors: {
                                1: "Addresses the task adequately in a simple manner. Content is partially relevant and contains some inappropriacy",
                                2: "Addresses the task adequately with some development. Content is mostly relevant but may not be appropriate",
                                3: "Addresses the task satisfactorily with somewhat substantive ideas. Content is relevant but may not be appropriate",
                                4: "Addresses the task effectively with good development and substantive ideas. Content is relevant and appropriate",
                                5: "Addresses the task effectively with excellent development and ideas. Content is relevant and appropriate, with sophistication"
                            }
                        },
                        {
                            id: "ta_dm",
                            name: "Discourse Management",
                            max: 5,
                            descriptors: {
                                1: "Produces responses which are extended beyond short phrases, despite hesitation. Uses basic cohesive devices.",
                                2: "Produces satisfactory stretches beyond short phrases, despite hesitation. Uses general cohesive devices.",
                                3: "Produces extended stretches of language despite some hesitation. Uses a range of cohesive devices",
                                4: "Produces extended stretches of language with very little hesitation. Uses a range of cohesive devices and discourse markers.",
                                5: "Produces extended stretches of language with no hesitation. Uses a wide range of cohesive devices and discourse markers."
                            }
                        },
                        {
                            id: "ta_ph",
                            name: "Language",
                            max: 5,
                            descriptors: {
                                1: "Shows a good degree of control of simple grammatical forms. Uses a range of appropriate vocabulary. Is less intelligible.",
                                2: "Shows a good degree of control of simple grammatical forms but with no attempts on complex grammatical forms.",
                                3: "Shows a good degree of control of simple forms and attempts some complex forms. Uses appropriate vocabulary. Intelligible.",
                                4: "Shows a good degree of control of a satisfactory range of simple and some complex forms. Pronunciation mostly appropriate.",
                                5: "Shows a good degree of control of a range of simple and complex forms. Broad range of appropriate vocabulary. Intelligible."
                            }
                        }
                    ]
                },
                {
                    id: "task_b",
                    name: "TASK B: Group Discussion",
                    criteria: [
                        {
                            id: "tb_td",
                            name: "Topic Development",
                            max: 5,
                            descriptors: {
                                1: "Response generally lacks substance beyond expressing very simple ideas",
                                2: "Mostly simple ideas are expressed, with limited development",
                                3: "Ideas are satisfactorily expressed and developed, although they may not always be immediately clear",
                                4: "Ideas are expressed clearly with substantive development",
                                5: "Ideas are sophisticated, well developed, and convincingly expressed"
                            }
                        },
                        {
                            id: "tb_ic",
                            name: "Interactive Communication",
                            max: 5,
                            descriptors: {
                                1: "Initiates and responds appropriately. Keeps interaction going with very little prompting and support.",
                                2: "Initiates and responds appropriately. Keeps interaction going with some prompting and support.",
                                3: "Initiates and responds appropriately. Maintains and negotiates towards an outcome with very little support.",
                                4: "Initiates and responds appropriately, occasionally linking contributions to others. Negotiates with no support.",
                                5: "Initiates and responds appropriately, linking contributions to others. Actively negotiates towards an outcome."
                            }
                        },
                        {
                            id: "tb_dm",
                            name: "Discourse Management",
                            max: 5,
                            descriptors: {
                                1: "Handles communication despite much hesitation. Constructs simple utterances with some repetition.",
                                2: "Handles communication despite hesitation. Constructs longer utterances with some repetition.",
                                3: "Handles communication despite some hesitation. Organises extended discourse; occasional inaccuracies occur.",
                                4: "Handles communication with little hesitation. Uses accurate and appropriate resources; clear organisation.",
                                5: "Handles communication with very little hesitation. Fluent, coherent extended discourse with clear organisation."
                            }
                        },
                        {
                            id: "tb_lg",
                            name: "Language",
                            max: 5,
                            descriptors: {
                                1: "Shows a good degree of control of simple forms. Uses basic vocabulary. Less intelligible.",
                                2: "Control of simple forms with no attempts on complex forms. Broad basic vocabulary. Mostly intelligible.",
                                3: "Control of simple forms and attempts complex forms. Appropriate vocabulary. Intonation generally appropriate.",
                                4: "Control of satisfactory range of simple and some complex forms. Broad range of vocabulary. Pronunciation mostly appropriate.",
                                5: "Wide range of simple and complex forms with accuracy. Intelligible, precise, and pronunciation is appropriate."
                            }
                        }
                    ]
                }
            ]
        };

        let registry = {};
        let editingProfileId = null;
        let draftConfig = null;

        function init() {
            const savedRegistry = localStorage.getItem(REGISTRY_KEY);
            if (savedRegistry) {
                try { registry = JSON.parse(savedRegistry); } catch (e) { registry = {}; }
            } else {
                const defaultId = "scheme_" + Date.now();
                registry[defaultId] = { id: defaultId, ...DEFAULT_EP3_SCHEMA };
                saveRegistry();
            }

            const urlParams = new URLSearchParams(window.location.search);
            const editTargetId = urlParams.get('edit_id');
            if (editTargetId && registry[editTargetId]) {
                editProfile(editTargetId);
            }

            renderDashboard();
        }

        function saveRegistry() {
            localStorage.setItem(REGISTRY_KEY, JSON.stringify(registry));
        }

        function renderDashboard() {
            const listContainer = document.getElementById('scoresheetsList');
            const emptyNotice = document.getElementById('emptyNotice');
            listContainer.innerHTML = '';

            const profileIds = Object.keys(registry);
            if (profileIds.length === 0) {
                emptyNotice.classList.remove('hidden');
                return;
            }
            emptyNotice.classList.add('hidden');

            profileIds.forEach(id => {
                const item = registry[id];
                let totalMarks = 0;
                let critCount = 0;
                item.tasks.forEach(t => t.criteria.forEach(c => {
                    totalMarks += c.max;
                    critCount++;
                }));

                const card = document.createElement('div');
                card.className = "bg-slate-50 border border-slate-200/80 rounded-2xl p-5 hover:border-indigo-300 transition-all flex flex-col justify-between";
                card.innerHTML = `
                    <div>
                        <div class="flex items-start justify-between gap-2 mb-1.5">
                            <span class="bg-indigo-100 text-indigo-800 text-[10px] font-black px-2 py-0.5 rounded font-mono uppercase">${item.courseCode || 'GENERAL'}</span>
                            <span class="bg-slate-200/80 text-slate-700 text-[10px] font-black px-2 py-0.5 rounded-full">${item.weight}% Weight</span>
                        </div>
                        <h3 class="text-sm font-bold text-slate-800 leading-snug mb-3">${item.courseFullName || item.courseTitle || 'Untitled Assessment'}</h3>
                        <div class="text-xs text-slate-500 mb-4 space-y-1">
                            <div><i class="fa-solid fa-layer-group text-slate-400 mr-1.5"></i>${item.tasks.length} Task Section(s)</div>
                            <div><i class="fa-solid fa-chart-simple text-slate-400 mr-1.5"></i>${critCount} Criteria (${totalMarks} Max Raw Score)</div>
                        </div>
                    </div>
                    <div class="flex items-center gap-2 pt-3 border-t border-slate-200/60">
                        <button onclick="launchScoresheet('${id}')" class="grow bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold py-2 rounded-xl transition-colors cursor-pointer flex items-center justify-center gap-1.5">
                            <i class="fa-solid fa-arrow-up-right-from-square"></i> Open Scoresheet
                        </button>
                        <button onclick="editProfile('${id}')" title="Edit Scheme" class="p-2 text-slate-500 hover:text-indigo-600 bg-white border border-slate-200 rounded-xl cursor-pointer">
                            <i class="fa-solid fa-pen-to-square"></i>
                        </button>
                        <button onclick="deleteProfile('${id}')" title="Delete Scheme" class="p-2 text-slate-400 hover:text-rose-600 bg-white border border-slate-200 rounded-xl cursor-pointer">
                            <i class="fa-solid fa-trash-can"></i>
                        </button>
                    </div>
                `;
                listContainer.appendChild(card);
            });
        }

        function applyCoursePreset(code, name, weight) {
            document.getElementById('courseCode').value = code;
            document.getElementById('courseFullName').value = name;
            document.getElementById('courseWeight').value = weight;
            if (draftConfig) {
                draftConfig.courseCode = code;
                draftConfig.courseFullName = name;
                draftConfig.weight = weight;
            }
        }

        function showCreateModal() {
            editingProfileId = "scheme_" + Date.now();
            draftConfig = {
                id: editingProfileId,
                courseCode: "",
                courseFullName: "",
                weight: 30,
                tasks: [
                    {
                        id: `task_${Date.now()}`,
                        name: "TASK 1: Main Assessment",
                        criteria: [
                            {
                                id: `crit_${Date.now()}_1`,
                                name: "Evaluation Criterion",
                                max: 5,
                                descriptors: { 1: "", 2: "", 3: "", 4: "", 5: "" }
                            }
                        ]
                    }
                ]
            };
            document.getElementById('editorTitle').innerText = "Create New Assessment Scheme";
            renderEditorForm();
            document.getElementById('editorPanel').classList.remove('hidden');
            window.scrollTo({ top: document.getElementById('editorPanel').offsetTop - 20, behavior: 'smooth' });
        }

        function editProfile(id) {
            editingProfileId = id;
            draftConfig = JSON.parse(JSON.stringify(registry[id]));
            document.getElementById('editorTitle').innerText = `Edit: ${draftConfig.courseCode || ''} ${draftConfig.courseFullName || ''}`;
            renderEditorForm();
            document.getElementById('editorPanel').classList.remove('hidden');
            window.scrollTo({ top: document.getElementById('editorPanel').offsetTop - 20, behavior: 'smooth' });
        }

        function hideEditor() {
            document.getElementById('editorPanel').classList.add('hidden');
            editingProfileId = null;
            draftConfig = null;
        }

        function renderEditorForm() {
            document.getElementById('courseCode').value = draftConfig.courseCode || "";
            document.getElementById('courseFullName').value = draftConfig.courseFullName || draftConfig.courseTitle || "";
            document.getElementById('courseWeight').value = draftConfig.weight || 100;

            const container = document.getElementById('tasksContainer');
            container.innerHTML = '';

            draftConfig.tasks.forEach((task, tIndex) => {
                const taskDiv = document.createElement('div');
                taskDiv.className = "bg-slate-50 border border-slate-200 rounded-xl p-4";
                taskDiv.innerHTML = `
                    <div class="flex items-center justify-between gap-3 mb-3 border-b border-slate-200/80 pb-2">
                        <input type="text" value="${task.name}" onchange="draftConfig.tasks[${tIndex}].name = this.value" class="bg-white border border-slate-200 rounded-lg px-2.5 py-1 text-xs font-bold text-indigo-900 grow" placeholder="Task Name">
                        <button onclick="removeTaskBlock(${tIndex})" class="text-rose-500 hover:text-rose-700 text-xs px-2 py-1 cursor-pointer"><i class="fa-solid fa-trash-can"></i></button>
                    </div>
                    <div class="space-y-4 mb-3" id="criteria_wrap_${tIndex}"></div>
                    <button onclick="addCriterion(${tIndex})" class="text-indigo-600 hover:text-indigo-800 text-xs font-bold flex items-center gap-1 cursor-pointer mt-2">
                        <i class="fa-solid fa-plus text-[10px]"></i> Add Criterion
                    </button>
                `;
                container.appendChild(taskDiv);

                const cWrap = taskDiv.querySelector(`#criteria_wrap_${tIndex}`);
                task.criteria.forEach((c, cIndex) => {
                    if (!c.descriptors) c.descriptors = {};
                    const cBlock = document.createElement('div');
                    cBlock.className = "bg-white p-3.5 rounded-xl border border-slate-200/90 shadow-2xs";
                    
                    let descriptorsHtml = '';
                    for (let scale = 1; scale <= c.max; scale++) {
                        const currentVal = (c.descriptors && c.descriptors[scale]) ? c.descriptors[scale] : "";
                        descriptorsHtml += `
                            <div class="flex items-start gap-2 text-xs">
                                <span class="w-6 h-6 rounded bg-slate-100 border border-slate-200 text-slate-700 font-bold flex items-center justify-center shrink-0 mt-1">${scale}</span>
                                <textarea rows="1" onchange="updateDescriptor(${tIndex}, ${cIndex}, ${scale}, this.value)" placeholder="Band descriptor for score ${scale}..." class="w-full bg-slate-50 border border-slate-200 rounded-lg p-1.5 text-xs text-slate-700 focus:outline-indigo-500 leading-snug">${currentVal}</textarea>
                            </div>
                        `;
                    }

                    cBlock.innerHTML = `
                        <div class="flex items-center gap-2 mb-2 pb-2 border-b border-slate-100">
                            <input type="text" value="${c.name}" onchange="draftConfig.tasks[${tIndex}].criteria[${cIndex}].name = this.value" class="bg-slate-50 border border-slate-200 rounded-lg px-2.5 py-1 text-xs font-bold text-slate-800 grow" placeholder="Criterion Title">
                            <div class="flex items-center gap-1 shrink-0">
                                <span class="text-[11px] font-bold text-slate-400">Max Score:</span>
                                <input type="number" min="1" max="20" value="${c.max}" onchange="changeCriterionMax(${tIndex}, ${cIndex}, this.value)" class="w-14 bg-slate-50 border border-slate-200 rounded-lg px-2 py-1 text-xs font-bold text-center">
                            </div>
                            <button onclick="removeCriterion(${tIndex}, ${cIndex})" class="text-slate-400 hover:text-rose-500 text-xs px-1.5 cursor-pointer"><i class="fa-solid fa-xmark"></i></button>
                        </div>
                        <div class="space-y-2 mt-2">
                            <span class="block text-[10px] font-bold uppercase tracking-wider text-slate-400">Score Scale Descriptors (1 to ${c.max})</span>
                            ${descriptorsHtml}
                        </div>
                    `;
                    cWrap.appendChild(cBlock);
                });
            });
        }

        function changeCriterionMax(tIndex, cIndex, newMaxVal) {
            const val = parseInt(newMaxVal) || 1;
            draftConfig.tasks[tIndex].criteria[cIndex].max = val;
            renderEditorForm();
        }

        function updateDescriptor(tIndex, cIndex, scale, text) {
            if (!draftConfig.tasks[tIndex].criteria[cIndex].descriptors) {
                draftConfig.tasks[tIndex].criteria[cIndex].descriptors = {};
            }
            draftConfig.tasks[tIndex].criteria[cIndex].descriptors[scale] = text;
        }

        function addTaskBlock() {
            draftConfig.tasks.push({
                id: `task_${Date.now()}`,
                name: `TASK ${draftConfig.tasks.length + 1}: Section`,
                criteria: [{ id: `crit_${Date.now()}_1`, name: "Criterion 1", max: 5, descriptors: { 1: "", 2: "", 3: "", 4: "", 5: "" } }]
            });
            renderEditorForm();
        }

        function removeTaskBlock(tIndex) {
            if (draftConfig.tasks.length <= 1) {
                alert("At least one task block is required.");
                return;
            }
            draftConfig.tasks.splice(tIndex, 1);
            renderEditorForm();
        }

        function addCriterion(tIndex) {
            draftConfig.tasks[tIndex].criteria.push({
                id: `crit_${Date.now()}`,
                name: `Criterion ${draftConfig.tasks[tIndex].criteria.length + 1}`,
                max: 5,
                descriptors: { 1: "", 2: "", 3: "", 4: "", 5: "" }
            });
            renderEditorForm();
        }

        function removeCriterion(tIndex, cIndex) {
            if (draftConfig.tasks[tIndex].criteria.length <= 1) {
                alert("Each task must have at least one criterion.");
                return;
            }
            draftConfig.tasks[tIndex].criteria.splice(cIndex, 1);
            renderEditorForm();
        }

        function loadEP3FullPreset() {
            draftConfig = { id: editingProfileId, ...JSON.parse(JSON.stringify(DEFAULT_EP3_SCHEMA)) };
            renderEditorForm();
        }

        function saveActiveProfile() {
            draftConfig.courseCode = document.getElementById('courseCode').value.trim().toUpperCase() || "GEN101";
            draftConfig.courseFullName = document.getElementById('courseFullName').value.trim() || "Course Assessment";
            draftConfig.weight = parseFloat(document.getElementById('courseWeight').value) || 100;

            registry[editingProfileId] = draftConfig;
            saveRegistry();
            launchScoresheet(editingProfileId);
        }

        function launchScoresheet(id) {
            localStorage.setItem(ACTIVE_ID_KEY, id);
            window.location.href = "scoresheet.html";
        }

        function deleteProfile(id) {
            if (!confirm(`Are you sure you want to delete this scheme? All associated marks will be removed.`)) return;
            delete registry[id];
            localStorage.removeItem(`UniSZA_Data_${id}`);
            saveRegistry();
            renderDashboard();
        }

        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
