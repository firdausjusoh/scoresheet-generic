<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assessment Rubric Configurator</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Poppins', sans-serif; }</style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 p-6 flex flex-col justify-between">
    <div class="max-w-4xl mx-auto w-full">
        <!-- Header -->
        <header class="bg-gradient-to-r from-blue-700 to-indigo-800 text-white rounded-2xl p-6 shadow-xl mb-6 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div>
                <span class="bg-blue-500/30 text-blue-200 text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider">Configuration Engine</span>
                <h1 class="text-2xl font-black mt-1">Rubric & Scoresheet Setup</h1>
                <p class="text-blue-100 text-xs mt-1">Design customized evaluation schemes for any course</p>
            </div>
            <div class="flex gap-2">
                <button onclick="loadDefaultEP3()" class="bg-white/10 hover:bg-white/20 text-white border border-white/20 px-3 py-2 rounded-xl text-xs font-semibold cursor-pointer transition-colors">
                    <i class="fa-solid fa-rotate-left mr-1"></i> Reset to EP3
                </button>
            </div>
        </header>

        <!-- Course Meta Configuration -->
        <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200/80 mb-6">
            <h2 class="text-sm font-bold text-slate-700 uppercase tracking-wider mb-4 flex items-center gap-2">
                <i class="fa-solid fa-sliders text-indigo-600"></i> Course & Weighting Setup
            </h2>
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                <div class="sm:col-span-2">
                    <label class="block text-xs font-bold text-slate-500 mb-1">Assessment / Course Title</label>
                    <input type="text" id="courseTitle" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm font-semibold focus:outline-indigo-500" placeholder="e.g. EP3 Interactive Speaking Assessment">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 mb-1">Weighting Component (%)</label>
                    <input type="number" id="courseWeight" min="1" max="100" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm font-semibold focus:outline-indigo-500" placeholder="40">
                </div>
            </div>
        </div>

        <!-- Task & Rubric Items Builder -->
        <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200/80 mb-6">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-sm font-bold text-slate-700 uppercase tracking-wider flex items-center gap-2">
                    <i class="fa-solid fa-list-check text-indigo-600"></i> Assessment Tasks & Rubric Criteria
                </h2>
                <button onclick="addTaskBlock()" class="bg-indigo-50 hover:bg-indigo-100 text-indigo-600 px-3 py-1.5 rounded-xl text-xs font-bold border border-indigo-200 cursor-pointer transition-colors">
                    <i class="fa-solid fa-plus mr-1"></i> Add Task Block
                </button>
            </div>

            <div id="tasksContainer" class="space-y-6"></div>
        </div>

        <!-- Action Footer -->
        <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200/80 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-2">
                <button onclick="exportConfigJSON()" class="text-xs text-slate-600 bg-slate-100 hover:bg-slate-200 font-semibold px-3 py-2 rounded-xl transition-colors cursor-pointer">
                    <i class="fa-solid fa-download mr-1"></i> Backup Scheme (.json)
                </button>
                <label class="text-xs text-slate-600 bg-slate-100 hover:bg-slate-200 font-semibold px-3 py-2 rounded-xl transition-colors cursor-pointer">
                    <i class="fa-solid fa-upload mr-1"></i> Restore Scheme
                    <input type="file" id="importInput" accept=".json" class="hidden" onchange="importConfigJSON(event)">
                </label>
            </div>
            <button onclick="saveAndLaunch()" class="w-full sm:w-auto bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-bold px-6 py-2.5 rounded-xl shadow-md transition-colors flex items-center justify-center gap-2 cursor-pointer">
                <span>Save Scheme & Launch Engine</span>
                <i class="fa-solid fa-arrow-right text-xs"></i>
            </button>
        </div>
    </div>

    <script>
        const DEFAULT_SCHEMA = {
            courseTitle: "EP3 Interactive Speaking Assessment",
            weight: 40,
            tasks: [
                {
                    id: "task_a",
                    name: "TASK A: Individual Speech",
                    criteria: [
                        { id: "ta_tf", name: "Task Fulfillment", max: 5 },
                        { id: "ta_dm", name: "Discourse Management", max: 5 },
                        { id: "ta_ph", name: "Language", max: 5 }
                    ]
                },
                {
                    id: "task_b",
                    name: "TASK B: Group Discussion",
                    criteria: [
                        { id: "tb_td", name: "Topic Development", max: 5 },
                        { id: "tb_ic", name: "Interactive Communication", max: 5 },
                        { id: "tb_dm", name: "Discourse Management", max: 5 },
                        { id: "tb_lg", name: "Language", max: 5 }
                    ]
                }
            ]
        };

        let activeConfig = JSON.parse(JSON.stringify(DEFAULT_SCHEMA));

        function init() {
            const saved = localStorage.getItem('Dynamic_Assessment_Rubric_Config');
            if (saved) {
                try { activeConfig = JSON.parse(saved); } catch (e) { activeConfig = DEFAULT_SCHEMA; }
            }
            renderForm();
        }

        function renderForm() {
            document.getElementById('courseTitle').value = activeConfig.courseTitle || "";
            document.getElementById('courseWeight').value = activeConfig.weight || 100;

            const container = document.getElementById('tasksContainer');
            container.innerHTML = '';

            activeConfig.tasks.forEach((task, tIndex) => {
                const taskDiv = document.createElement('div');
                taskDiv.className = "bg-slate-50 border border-slate-200 rounded-xl p-4";
                taskDiv.innerHTML = `
                    <div class="flex items-center justify-between gap-3 mb-3 border-b border-slate-200/80 pb-2">
                        <input type="text" value="${task.name}" onchange="updateTaskName(${tIndex}, this.value)" class="bg-white border border-slate-200 rounded-lg px-2.5 py-1 text-xs font-bold text-indigo-900 focus:outline-indigo-500 grow" placeholder="Task Name">
                        <button onclick="removeTaskBlock(${tIndex})" class="text-rose-500 hover:text-rose-700 text-xs px-2 py-1"><i class="fa-solid fa-trash-can"></i></button>
                    </div>
                    <div class="space-y-2 mb-3" id="criteria_container_${tIndex}">
                        ${task.criteria.map((c, cIndex) => `
                            <div class="flex items-center gap-2">
                                <input type="text" value="${c.name}" onchange="updateCriterionName(${tIndex},${cIndex}, this.value)" class="bg-white border border-slate-200 rounded-lg px-2.5 py-1 text-xs font-semibold text-slate-700 grow" placeholder="Criterion Label">
                                <div class="flex items-center gap-1 shrink-0">
                                    <span class="text-[11px] font-bold text-slate-400">Max:</span>
                                    <input type="number" min="1" max="50" value="${c.max}" onchange="updateCriterionMax(${tIndex},${cIndex}, this.value)" class="w-16 bg-white border border-slate-200 rounded-lg px-2 py-1 text-xs font-bold text-center">
                                </div>
                                <button onclick="removeCriterion(${tIndex},${cIndex})" class="text-slate-400 hover:text-rose-500 text-xs px-1"><i class="fa-solid fa-xmark"></i></button>
                            </div>
                        `).join('')}
                    </div>
                    <button onclick="addCriterion(${tIndex})" class="text-indigo-600 hover:text-indigo-800 text-xs font-bold flex items-center gap-1">
                        <i class="fa-solid fa-plus text-[10px]"></i> Add Criterion
                    </button>
                `;
                container.appendChild(taskDiv);
            });
        }

        function updateTaskName(tIndex, val) { activeConfig.tasks[tIndex].name = val; }
        function updateCriterionName(tIndex, cIndex, val) { activeConfig.tasks[tIndex].criteria[cIndex].name = val; }
        function updateCriterionMax(tIndex, cIndex, val) { activeConfig.tasks[tIndex].criteria[cIndex].max = parseInt(val) || 1; }

        function addTaskBlock() {
            const nextIdx = activeConfig.tasks.length + 1;
            activeConfig.tasks.push({
                id: `task_${Date.now()}`,
                name: `TASK ${nextIdx}: New Component`,
                criteria: [{ id: `crit_${Date.now()}_1`, name: "Criterion 1", max: 5 }]
            });
            renderForm();
        }

        function removeTaskBlock(tIndex) {
            if (activeConfig.tasks.length <= 1) {
                alert("You need at least one task block.");
                return;
            }
            activeConfig.tasks.splice(tIndex, 1);
            renderForm();
        }

        function addCriterion(tIndex) {
            activeConfig.tasks[tIndex].criteria.push({
                id: `crit_${Date.now()}`,
                name: `Criterion ${activeConfig.tasks[tIndex].criteria.length + 1}`,
                max: 5
            });
            renderForm();
        }

        function removeCriterion(tIndex, cIndex) {
            if (activeConfig.tasks[tIndex].criteria.length <= 1) {
                alert("Each task must have at least one criterion.");
                return;
            }
            activeConfig.tasks[tIndex].criteria.splice(cIndex, 1);
            renderForm();
        }

        function loadDefaultEP3() {
            activeConfig = JSON.parse(JSON.stringify(DEFAULT_SCHEMA));
            renderForm();
        }

        function collectConfig() {
            activeConfig.courseTitle = document.getElementById('courseTitle').value.trim() || "Course Assessment Engine";
            activeConfig.weight = parseFloat(document.getElementById('courseWeight').value) || 100;
            return activeConfig;
        }

        function saveAndLaunch() {
            const cfg = collectConfig();
            localStorage.setItem('Dynamic_Assessment_Rubric_Config', JSON.stringify(cfg));
            window.location.href = "scoresheet.html";
        }

        function exportConfigJSON() {
            const cfg = collectConfig();
            const blob = new Blob([JSON.stringify(cfg, null, 2)], { type: "application/json" });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = `Rubric_Scheme_${cfg.courseTitle.replace(/\s+/g, '_')}.json`;
            link.click();
        }

        function importConfigJSON(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    activeConfig = JSON.parse(e.target.result);
                    renderForm();
                } catch (err) { alert("Invalid scheme JSON file."); }
            };
            reader.readAsText(file);
        }

        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
